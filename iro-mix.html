<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いろまぜ算数 - 比で色を作ろう！</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 16px;
    }

    .main {
      display: flex;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    /* 左：操作パネル */
    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      min-width: 280px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .panel h2 {
      font-size: 1rem;
      color: #555;
      margin-bottom: 16px;
      text-align: center;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ccc;
      flex-shrink: 0;
    }

    .color-label {
      width: 36px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      background: #e0e0e0;
      color: #333;
      transition: background 0.15s;
      font-weight: bold;
    }

    .counter button:hover { background: #c8c8c8; }
    .counter button:active { background: #aaa; }

    .counter .num {
      width: 32px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: #222;
    }

    .ratio-display {
      text-align: center;
      margin: 20px 0 12px;
      font-size: 1.1rem;
      color: #555;
    }

    .ratio-display span {
      font-size: 1.6rem;
      font-weight: bold;
      color: #222;
      letter-spacing: 2px;
    }

    /* 右：結果エリア */
    .result-area {
      background: white;
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      min-width: 280px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .color-compare {
      display: flex;
      gap: 12px;
    }

    .color-box-wrap {
      flex: 1;
      text-align: center;
    }

    .color-box-wrap p {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 6px;
    }

    .color-box {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      border: 3px solid #ddd;
      transition: background-color 0.3s;
    }

    .color-box.target {
      border-color: #999;
    }

    .color-box.mine {
      border-color: #66aaff;
    }

    /* 履歴 */
    .history-area h3 {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 8px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #444;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .history-swatch {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }

    .history-item.correct {
      background: #e8f8e8;
      border: 1px solid #88cc88;
      font-weight: bold;
    }

    /* 正解メッセージ */
    .feedback {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 1.8rem;
      color: #cc4444;
    }

    .feedback.correct { color: #228822; }

    /* ステージ表示 */
    .stage-bar {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 4px;
    }

    .next-btn {
      display: block;
      margin: 0 auto;
      padding: 10px 32px;
      background: #4488ff;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .next-btn:hover { background: #2266dd; }
    .next-btn:disabled { background: #aaa; cursor: default; }

    .ratio-hint {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      margin-top: 4px;
    }

    /* モード切替タブ */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-tab {
      padding: 8px 24px;
      border-radius: 20px;
      border: 2px solid #ccc;
      background: white;
      font-size: 0.95rem;
      cursor: pointer;
      color: #888;
      font-weight: bold;
      transition: all 0.15s;
    }

    .mode-tab.active {
      background: #4488ff;
      border-color: #4488ff;
      color: white;
    }

    /* 自由探索モード */
    .free-result {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      border: 3px solid #66aaff;
      transition: background-color 0.3s;
      margin-bottom: 4px;
    }

    .free-label {
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 8px;
    }

    /* 色選択チェックボックス */
    .color-select-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .color-select-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 16px;
      border: 2px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      transition: all 0.15s;
    }

    .color-select-btn.selected {
      border-color: #4488ff;
      background: #e8f0ff;
      color: #224488;
    }

    .color-select-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>🎨 いろまぜ算数 ― 比で色を作ろう！</h1>

  <!-- モード切替 -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabStage" onclick="switchMode('stage')">🎯 チャレンジ</button>
    <button class="mode-tab" id="tabFree" onclick="switchMode('free')">🎨 じゆうにまぜる</button>
  </div>

  <!-- チャレンジモード -->
  <div id="modeStage">
    <div class="stage-bar" id="stageBar">ステージ 1 / 6</div>
    <div class="main">
      <div class="panel">
        <h2>絵の具の量を決めよう</h2>
        <div id="colorControls"></div>
        <div class="ratio-display">比： <span id="ratioText">—</span></div>
        <div class="ratio-hint" id="ratioHint"></div>
      </div>
      <div class="result-area">
        <div class="color-compare">
          <div class="color-box-wrap">
            <p>🎯 目標の色</p>
            <div class="color-box target" id="targetBox"></div>
          </div>
          <div class="color-box-wrap">
            <p>🖌️ 自分の色</p>
            <div class="color-box mine" id="myBox"></div>
          </div>
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" disabled onclick="nextStage()">次のステージへ →</button>
        <div class="history-area">
          <h3>試した記録</h3>
          <div class="history-list" id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 自由探索モード -->
  <div id="modeFree" style="display:none;">
    <div class="main">
      <div class="panel">
        <h2>混ぜる色を選ぼう</h2>
        <div class="color-select-area" id="freeColorSelect"></div>
        <h2 style="margin-bottom:12px;">量を決めよう</h2>
        <div id="freeColorControls"></div>
        <div class="ratio-display">比： <span id="freeRatioText">—</span></div>
        <div class="ratio-hint" id="freeRatioHint"></div>
      </div>
      <div class="result-area">
        <div class="free-label">🖌️ できた色</div>
        <div class="free-result" id="freeResultBox"></div>
        <div class="history-area">
          <h3>試した記録</h3>
          <div class="history-list" id="freeHistoryList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---- RYB → RGB 変換（絵の具の減法混色近似） ----
    // 各色のRYB値
    const COLORS = {
      赤: { ryb: [1, 0, 0], dot: '#e84040' },
      青: { ryb: [0, 0, 1], dot: '#3060e0' },
      黄: { ryb: [0, 1, 0], dot: '#f0c000' },
      白: { ryb: [0, 0, 0, 1], dot: '#f0f0f0', isWhite: true },
      黒: { ryb: [0, 0, 0, 0, 1], dot: '#222222', isBlack: true },
    };

    // RYB→RGB 変換テーブル（コーナー）
    function rybToRgb(r, y, b) {
      // 8コーナーのRGB値
      const cube = [
        [1, 1, 1],   // 000 white
        [1, 0, 0],   // 100 red
        [1, 1, 0],   // 010 yellow
        [1, 0.5, 0], // 110 red+yellow = orange
        [0.163, 0.373, 0.6], // 001 blue
        [0.5, 0, 0.5], // 101 red+blue = violet
        [0, 0.66, 0.2], // 011 yellow+blue = green
        [0.2, 0.094, 0.0], // 111 red+yellow+blue = dark brown
      ];

      const f = (c) => {
        const [c000, c100, c010, c110, c001, c101, c011, c111] = c;
        return (
          c000 * (1-r)*(1-y)*(1-b) +
          c100 * r*(1-y)*(1-b) +
          c010 * (1-r)*y*(1-b) +
          c110 * r*y*(1-b) +
          c001 * (1-r)*(1-y)*b +
          c101 * r*(1-y)*b +
          c011 * (1-r)*y*b +
          c111 * r*y*b
        );
      };

      return [
        f(cube.map(c => c[0])),
        f(cube.map(c => c[1])),
        f(cube.map(c => c[2])),
      ];
    }

    function mixColor(amounts) {
      // amounts: { 赤, 青, 黄, 白, 黒 }
      const total = Object.values(amounts).reduce((s, v) => s + v, 0);
      if (total === 0) return '#e8e8e8';

      const r = (amounts['赤'] || 0) / total;
      const y = (amounts['黄'] || 0) / total;
      const b = (amounts['青'] || 0) / total;
      const w = (amounts['白'] || 0) / total;
      const k = (amounts['黒'] || 0) / total;

      let [rr, gg, bb] = rybToRgb(r, y, b);

      // 白を混ぜる（明るく）
      rr = rr + w * (1 - rr);
      gg = gg + w * (1 - gg);
      bb = bb + w * (1 - bb);

      // 黒を混ぜる（暗く）
      rr = rr * (1 - k);
      gg = gg * (1 - k);
      bb = bb * (1 - k);

      const toHex = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
      return `#${toHex(rr)}${toHex(gg)}${toHex(bb)}`;
    }

    // ---- ステージ定義 ----
    // answer: 各色の比（整数）
    const STAGES = [
      {
        label: 'ステージ1：むらさき',
        colors: ['赤', '青'],
        answer: { 赤: 1, 青: 1 },
        hint: '赤と青を混ぜよう',
      },
      {
        label: 'ステージ2：オレンジ',
        colors: ['赤', '黄'],
        answer: { 赤: 1, 黄: 2 },
        hint: '赤と黄を混ぜよう',
      },
      {
        label: 'ステージ3：みどり',
        colors: ['青', '黄'],
        answer: { 青: 1, 黄: 3 },
        hint: '青と黄を混ぜよう',
      },
      {
        label: 'ステージ4：ピンク',
        colors: ['赤', '白'],
        answer: { 赤: 1, 白: 3 },
        hint: '赤と白を混ぜよう',
      },
      {
        label: 'ステージ5：こい青むらさき',
        colors: ['赤', '青', '黒'],
        answer: { 赤: 1, 青: 2, 黒: 1 },
        hint: '赤・青・黒を混ぜよう',
      },
      {
        label: 'ステージ6：やわらかいみどり',
        colors: ['青', '黄', '白'],
        answer: { 青: 1, 黄: 2, 白: 2 },
        hint: '青・黄・白を混ぜよう',
      },
    ];

    // ---- 状態 ----
    let currentStage = 0;
    let amounts = {};
    let history = [];

    function initStage() {
      const stage = STAGES[currentStage];
      amounts = {};
      stage.colors.forEach(c => amounts[c] = 0);
      history = [];

      document.getElementById('stageBar').textContent = `ステージ ${currentStage + 1} / ${STAGES.length}　―　${stage.hint}`;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('historyList').innerHTML = '';

      // 目標色
      const targetColor = mixColor(stage.answer);
      document.getElementById('targetBox').style.background = targetColor;
      document.getElementById('myBox').style.background = '#e8e8e8';

      renderControls();
      updateRatio();
    }

    function renderControls() {
      const stage = STAGES[currentStage];
      const container = document.getElementById('colorControls');
      container.innerHTML = '';

      stage.colors.forEach(name => {
        const info = COLORS[name];
        const row = document.createElement('div');
        row.className = 'color-row';

        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = info.dot;

        const label = document.createElement('div');
        label.className = 'color-label';
        label.textContent = name;

        const counter = document.createElement('div');
        counter.className = 'counter';

        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.onclick = () => { if (amounts[name] > 0) { amounts[name]--; update(); } };

        const numEl = document.createElement('div');
        numEl.className = 'num';
        numEl.id = `num-${name}`;
        numEl.textContent = '0';

        const plus = document.createElement('button');
        plus.textContent = '＋';
        plus.onclick = () => { if (amounts[name] < 9) { amounts[name]++; update(); } };

        counter.append(minus, numEl, plus);
        row.append(dot, label, counter);
        container.appendChild(row);
      });
    }

    function update() {
      const stage = STAGES[currentStage];

      // カウンター表示更新
      stage.colors.forEach(name => {
        const el = document.getElementById(`num-${name}`);
        if (el) el.textContent = amounts[name];
      });

      updateRatio();

      // 混合色
      const myColor = mixColor(amounts);
      document.getElementById('myBox').style.background = myColor;

      // 正解判定
      const correct = checkCorrect();
      const totalMy = Object.values(amounts).reduce((s, v) => s + v, 0);

      const fb = document.getElementById('feedback');
      if (totalMy === 0) {
        fb.textContent = '';
        fb.className = 'feedback';
        return;
      }

      if (correct) {
        fb.textContent = '🎉 正解！ぴったり合ったよ！';
        fb.className = 'feedback correct';
        document.getElementById('nextBtn').disabled = (currentStage >= STAGES.length - 1);
        addHistory(true);
      } else {
        fb.textContent = '';
        fb.className = 'feedback';
        addHistory(false);
      }
    }

    function updateRatio() {
      const stage = STAGES[currentStage];
      const vals = stage.colors.map(c => amounts[c]);
      const total = vals.reduce((s, v) => s + v, 0);

      if (total === 0) {
        document.getElementById('ratioText').textContent = '—';
        document.getElementById('ratioHint').textContent = '';
        return;
      }

      const ratioStr = stage.colors
        .map(c => `${c}${amounts[c]}`)
        .join(' ：');

      const simpleStr = vals.join(' ：');
      document.getElementById('ratioText').textContent = simpleStr;

      // 最簡比を表示
      const g = gcdArr(vals.filter(v => v > 0));
      const simplified = vals.map(v => v / g).join(' ：');
      if (simplified !== simpleStr) {
        document.getElementById('ratioHint').textContent = `（最も簡単な比：${simplified}）`;
      } else {
        document.getElementById('ratioHint').textContent = '';
      }
    }

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function gcdArr(arr) { return arr.reduce((a, b) => gcd(a, b)); }

    function checkCorrect() {
      const stage = STAGES[currentStage];
      const answerVals = stage.colors.map(c => stage.answer[c] || 0);
      const myVals = stage.colors.map(c => amounts[c] || 0);

      const totalAns = answerVals.reduce((s, v) => s + v, 0);
      const totalMy = myVals.reduce((s, v) => s + v, 0);
      if (totalAns === 0 || totalMy === 0) return false;

      // 比の等しさで判定（等しい比も正解）
      const g1 = gcdArr(answerVals.filter(v => v > 0));
      const g2 = gcdArr(myVals.filter(v => v > 0));
      const norm1 = answerVals.map(v => v / g1).join(',');
      const norm2 = myVals.map(v => v / g2).join(',');
      return norm1 === norm2;
    }

    let lastHistoryKey = null;

    function addHistory(correct) {
      const stage = STAGES[currentStage];
      const myColor = mixColor(amounts);
      const key = stage.colors.map(c => amounts[c]).join(',');

      // 同じ比の連続記録はしない
      if (key === lastHistoryKey) return;
      lastHistoryKey = key;

      const total = Object.values(amounts).reduce((s, v) => s + v, 0);
      if (total === 0) return;

      const ratioStr = stage.colors.map(c => amounts[c]).join(' ：');

      const item = document.createElement('div');
      item.className = 'history-item' + (correct ? ' correct' : '');

      const swatch = document.createElement('div');
      swatch.className = 'history-swatch';
      swatch.style.background = myColor;

      item.appendChild(swatch);
      item.appendChild(document.createTextNode(
        `${stage.colors.join('：')} = ${ratioStr}` + (correct ? '　✓ 正解！' : '')
      ));

      const list = document.getElementById('historyList');
      list.insertBefore(item, list.firstChild);

      history.push({ key, correct });
    }

    function nextStage() {
      if (currentStage < STAGES.length - 1) {
        currentStage++;
        initStage();
      }
    }

    // ---- 自由探索モード ----
    const ALL_COLORS = ['赤', '青', '黄', '白', '黒'];
    let freeSelected = ['赤', '青']; // 選択中の色
    let freeAmounts = { 赤: 0, 青: 0 };
    let freeLastKey = null;

    function initFreeMode() {
      renderFreeColorSelect();
      renderFreeControls();
      updateFree();
    }

    function renderFreeColorSelect() {
      const area = document.getElementById('freeColorSelect');
      area.innerHTML = '';
      ALL_COLORS.forEach(name => {
        const info = COLORS[name];
        const btn = document.createElement('button');
        btn.className = 'color-select-btn' + (freeSelected.includes(name) ? ' selected' : '');
        btn.onclick = () => toggleFreeColor(name);

        const dot = document.createElement('div');
        dot.className = 'color-select-dot';
        dot.style.background = info.dot;

        btn.appendChild(dot);
        btn.appendChild(document.createTextNode(name));
        area.appendChild(btn);
      });
    }

    function toggleFreeColor(name) {
      if (freeSelected.includes(name)) {
        if (freeSelected.length <= 2) return; // 最低2色は維持
        freeSelected = freeSelected.filter(c => c !== name);
        delete freeAmounts[name];
      } else {
        if (freeSelected.length >= 4) return; // 最大4色
        freeSelected.push(name);
        freeAmounts[name] = 0;
      }
      renderFreeColorSelect();
      renderFreeControls();
      updateFree();
    }

    function renderFreeControls() {
      const container = document.getElementById('freeColorControls');
      container.innerHTML = '';

      freeSelected.forEach(name => {
        const info = COLORS[name];
        const row = document.createElement('div');
        row.className = 'color-row';

        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = info.dot;

        const label = document.createElement('div');
        label.className = 'color-label';
        label.textContent = name;

        const counter = document.createElement('div');
        counter.className = 'counter';

        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.onclick = () => { if (freeAmounts[name] > 0) { freeAmounts[name]--; updateFree(); } };

        const numEl = document.createElement('div');
        numEl.className = 'num';
        numEl.id = `free-num-${name}`;
        numEl.textContent = freeAmounts[name] || 0;

        const plus = document.createElement('button');
        plus.textContent = '＋';
        plus.onclick = () => { if (freeAmounts[name] < 9) { freeAmounts[name]++; updateFree(); } };

        counter.append(minus, numEl, plus);
        row.append(dot, label, counter);
        container.appendChild(row);
      });
    }

    function updateFree() {
      freeSelected.forEach(name => {
        const el = document.getElementById(`free-num-${name}`);
        if (el) el.textContent = freeAmounts[name] || 0;
      });

      const myColor = mixColor(freeAmounts);
      document.getElementById('freeResultBox').style.background = myColor;

      // 比の表示
      const vals = freeSelected.map(c => freeAmounts[c] || 0);
      const total = vals.reduce((s, v) => s + v, 0);

      if (total === 0) {
        document.getElementById('freeRatioText').textContent = '—';
        document.getElementById('freeRatioHint').textContent = '';
        return;
      }

      document.getElementById('freeRatioText').textContent = vals.join(' ：');

      const nonZero = vals.filter(v => v > 0);
      if (nonZero.length >= 2) {
        const g = gcdArr(nonZero);
        const simplified = vals.map(v => v / g).join(' ：');
        const simpleStr = vals.join(' ：');
        document.getElementById('freeRatioHint').textContent =
          simplified !== simpleStr ? `（最も簡単な比：${simplified}）` : '';
      } else {
        document.getElementById('freeRatioHint').textContent = '';
      }

      // 履歴に追加
      const key = freeSelected.map(c => freeAmounts[c] || 0).join(',') + freeSelected.join('');
      if (key !== freeLastKey && total > 0) {
        freeLastKey = key;
        const item = document.createElement('div');
        item.className = 'history-item';

        const swatch = document.createElement('div');
        swatch.className = 'history-swatch';
        swatch.style.background = myColor;

        item.appendChild(swatch);
        item.appendChild(document.createTextNode(
          freeSelected.map(c => `${c}${freeAmounts[c] || 0}`).join(' ：')
        ));

        const list = document.getElementById('freeHistoryList');
        list.insertBefore(item, list.firstChild);
      }
    }

    // ---- モード切替 ----
    function switchMode(mode) {
      document.getElementById('modeStage').style.display = mode === 'stage' ? '' : 'none';
      document.getElementById('modeFree').style.display = mode === 'free' ? '' : 'none';
      document.getElementById('tabStage').className = 'mode-tab' + (mode === 'stage' ? ' active' : '');
      document.getElementById('tabFree').className = 'mode-tab' + (mode === 'free' ? ' active' : '');
    }

    // 初期化
    initStage();
    initFreeMode();
  </script>
</body>
</html>
